<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Nền tròn bo cong mềm mại với Gradient đẹp mắt -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>

  <!-- Khung ảnh chính giữa -->
  <g filter="url(#glow)">
    <!-- Viền khung ảnh trắng -->
    <rect x="22" y="22" width="84" height="84" rx="18" fill="#ffffff"/>
    
    <!-- Lòng khung ảnh (Bầu trời xanh) -->
    <rect x="28" y="28" width="72" height="72" rx="14" fill="#f0f9ff"/>

    <!-- Mặt trời vàng ấm áp -->
    <circle cx="48" cy="48" r="9" fill="url(#sunGrad)"/>

    <!-- Dãy núi 1 (Hậu cảnh) -->
    <path d="M34 86 L56 56 L76 86 Z" fill="url(#mountGrad1)" opacity="0.9"/>

    <!-- Dãy núi 2 (Tiền cảnh) -->
    <path d="M54 86 L74 62 L94 86 Z" fill="url(#mountGrad2)"/>

    <!-- Đỉnh núi tuyết trắng -->
    <polygon points="56,56 61,64 56,66 52,64" fill="#ffffff" opacity="0.8"/>
    <polygon points="74,62 79,69 74,71 70,69" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>